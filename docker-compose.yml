services:
  api:
    build: .
    container_name: luran_api
    ports:
      - "8000:8000"
    volumes:
      - ./app:/app/app
    env_file:
      - .env
    depends_on:
      - db
      - redis
      - qdrant
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://user:password@db:5432/luran_db
      REDIS_URL: redis://redis:6379/0
      QDRANT_URL: http://qdrant:6333
      GOOGLE_API_KEY: ${GOOGLE_API_KEY}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  worker:
    build: .
    container_name: luran_worker
    command: python worker.py
    volumes:
      - ./app:/app/app
      - ./worker.py:/app/worker.py
    env_file:
      - .env
    depends_on:
      - db
      - redis
      - qdrant
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://user:password@db:5432/luran_db
      REDIS_URL: redis://redis:6379/0
      QDRANT_URL: http://qdrant:6333

  db:
    image: postgres:15
    container_name: luran_db
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: luran_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backups:/backups  # Backup storage directory
    ports:
      - "5432:5432"
    restart: unless-stopped

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: luran_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@luran.dev
      PGADMIN_DEFAULT_PASSWORD: admin123
      PGADMIN_CONFIG_SERVER_MODE: 'False'
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: 'False'
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    ports:
      - "5050:80"
    depends_on:
      - db
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: luran_redis
    ports:
      - "6379:6379"
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:latest
    container_name: luran_qdrant
    ports:
      - "6333:6333"  # HTTP API
      - "6334:6334"  # gRPC API
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped
    environment:
      - QDRANT__SERVICE__GRPC_PORT=6334

volumes:
  postgres_data:
  pgadmin_data:
  qdrant_data:
