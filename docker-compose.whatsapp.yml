# WhatsApp linked-device sidecar. Override file: layer it on top of the base stack, e.g.
#   docker compose -f docker-compose.prod.yml -f docker-compose.whatsapp.yml up -d whatsapp-sidecar
# Does NOT publish a port: the backend reaches it as http://whatsapp-sidecar:8787 on the compose network.
# Runbook and capacity notes: docs/sop/whatsapp_sidecar.md
services:
  whatsapp-sidecar:
    build:
      context: ./whatsapp-sidecar
    image: ${WHATSAPP_SIDECAR_IMAGE:-luran-whatsapp-sidecar:latest}
    container_name: ${COMPOSE_PROJECT_NAME:-luran}_whatsapp_sidecar
    restart: unless-stopped
    mem_limit: ${WHATSAPP_SIDECAR_MEM_LIMIT:-512m}
    stop_grace_period: 20s            # SIGTERM flushes creds, closes sockets, releases leases
    environment:
      WHATSAPP_SIDECAR_TOKEN: ${WHATSAPP_SIDECAR_TOKEN:?set WHATSAPP_SIDECAR_TOKEN}
      WHATSAPP_WEBHOOK_SECRET: ${WHATSAPP_WEBHOOK_SECRET:?set WHATSAPP_WEBHOOK_SECRET}
      WHATSAPP_WEBHOOK_SECRET_PREVIOUS: ${WHATSAPP_WEBHOOK_SECRET_PREVIOUS:-}
      WHATSAPP_AUTH_MASTER_KEY: ${WHATSAPP_AUTH_MASTER_KEY:?set WHATSAPP_AUTH_MASTER_KEY}
      BACKEND_BASE: ${WHATSAPP_BACKEND_BASE:-http://api:8000}
      # Direct to Postgres (not pgbouncer): the schema bootstrap takes a session-level advisory lock.
      WHATSAPP_SIDECAR_DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      WHATSAPP_SIDECAR_REDIS_URL: ${WHATSAPP_SIDECAR_REDIS_URL:-redis://redis:6379/1}
      MAX_SESSIONS: ${WHATSAPP_MAX_SESSIONS:-3}
      RSS_REFUSE_MB: ${WHATSAPP_RSS_REFUSE_MB:-400}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
