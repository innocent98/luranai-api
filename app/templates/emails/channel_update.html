<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New update from {{ business_name }}</title>
</head>
<body style="margin:0;padding:0;background-color:#f1f5f9;font-family:Inter,system-ui,sans-serif;">
    <table width="100%" cellpadding="0" cellspacing="0" style="background-color:#f1f5f9;padding:40px 20px;">
        <tr>
            <td align="center">
                <table width="600" cellpadding="0" cellspacing="0" style="background-color:#ffffff;border-radius:16px;overflow:hidden;box-shadow:0 2px 8px rgba(49,46,129,0.04);">
                    <!-- Header -->
                    <tr>
                        <td style="background-color:#312e81;padding:32px 40px;text-align:center;">
                            <h1 style="margin:0;color:#ffffff;font-size:20px;font-weight:700;">{{ business_name }}</h1>
                            <p style="margin:8px 0 0;color:rgba(255,255,255,0.6);font-size:13px;">New channel update</p>
                        </td>
                    </tr>
                    <!-- Content -->
                    <tr>
                        <td style="padding:32px 40px;">
                            <h2 style="margin:0 0 12px;color:#0f172a;font-size:22px;font-weight:700;">{{ post_title }}</h2>
                            <p style="margin:0 0 24px;color:#475569;font-size:15px;line-height:1.7;">{{ post_excerpt }}</p>
                            <table cellpadding="0" cellspacing="0" width="100%">
                                <tr>
                                    <td align="center">
                                        <a href="{{ post_url }}" style="display:inline-block;background-color:#312e81;color:#ffffff;text-decoration:none;padding:14px 32px;border-radius:12px;font-size:14px;font-weight:600;">Read the full update</a>
                                    </td>
                                </tr>
                            </table>
                        </td>
                    </tr>
                    <!-- Footer -->
                    <tr>
                        <td style="padding:24px 40px;border-top:1px solid #e2e8f0;">
                            <p style="margin:0;color:#94a3b8;font-size:12px;text-align:center;line-height:1.6;">
                                You're receiving this because you follow {{ business_name }} on Luran.<br>
                                To stop these emails, unfollow this business or disable notifications in your account settings.
                            </p>
                        </td>
                    </tr>
                </table>
                <p style="margin:24px 0 0;color:#94a3b8;font-size:11px;text-align:center;">&copy; {{ current_year }} Luran</p>
            </td>
        </tr>
    </table>
</body>
</html>
