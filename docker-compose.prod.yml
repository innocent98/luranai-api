services:
  api:
    image: ${API_IMAGE:-luran-api:latest}
    container_name: ${COMPOSE_PROJECT_NAME:-luran}_api
    ports:
      # Bind to loopback only. Without the 127.0.0.1 prefix Docker publishes on
      # 0.0.0.0, so http://<vps-ip>:8000 answers straight from FastAPI —
      # bypassing nginx and everything it enforces (TLS, HSTS and the other
      # security headers, edge rate limits, access logs). A firewall does not
      # cover this: Docker inserts its own iptables rules in the DOCKER chain,
      # which is evaluated before ufw's, so `ufw deny 8000` does not apply to a
      # published port.
      #
      # Nothing needs the public bind: nginx runs on the host and proxies to
      # 127.0.0.1:${API_PORT}, CD's health check curls localhost over SSH on the
      # box itself, and the worker reaches the API over the compose network by
      # service name.
      - "127.0.0.1:${API_PORT:-8000}:8000"
    env_file:
      - .env
    depends_on:
      - pgbouncer
      - redis
      - qdrant
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@pgbouncer:5432/${POSTGRES_DB}
      REDIS_URL: ${REDIS_URL}
      QDRANT_URL: ${QDRANT_URL}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_EMBEDDING_MODEL: ${OPENAI_EMBEDDING_MODEL}
      OPENAI_LLM_MODEL: ${OPENAI_LLM_MODEL}
      EMBEDDING_DIMENSION: ${EMBEDDING_DIMENSION}
      ENVIRONMENT: ${ENVIRONMENT:-production}
      # Prod takes this default (2). The api is async/I/O-bound and loads no ML
      # models — all heavy work runs in the separate `worker` container — so it
      # does not need 4 gunicorn workers. Staging sets API_WORKERS=1 in its own
      # `.env` (owner-managed encrypted env); it is not set here.
      API_WORKERS: ${API_WORKERS:-2}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # Trust X-Forwarded-For only from the Docker bridge gateway (host nginx
      # reaches the 127.0.0.1-published port via the compose network gateway,
      # 172.18/172.19.0.1 today). Without this, request.client.host is that
      # gateway for every visitor and all IP rate limits share one bucket.
      # nginx must resolve the real visitor IP first (Cloudflare real_ip conf,
      # see docs/sop/trusted_proxy_client_ip.md). Uvicorn takes the rightmost
      # untrusted XFF entry, so a client-supplied XFF cannot spoof it.
      FORWARDED_ALLOW_IPS: ${FORWARDED_ALLOW_IPS:-172.16.0.0/12}
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health', timeout=5)",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    mem_limit: ${API_MEM_LIMIT:-900m}
    volumes:
      - ./logs:/app/logs
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  worker:
    image: ${API_IMAGE:-luran-api:latest}
    container_name: ${COMPOSE_PROJECT_NAME:-luran}_worker
    command: python worker.py
    env_file:
      - .env
    depends_on:
      - pgbouncer
      - redis
      - qdrant
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@pgbouncer:5432/${POSTGRES_DB}
      REDIS_URL: ${REDIS_URL}
      QDRANT_URL: ${QDRANT_URL}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_EMBEDDING_MODEL: ${OPENAI_EMBEDDING_MODEL}
      OPENAI_LLM_MODEL: ${OPENAI_LLM_MODEL}
      EMBEDDING_DIMENSION: ${EMBEDDING_DIMENSION}
      ENVIRONMENT: ${ENVIRONMENT:-production}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    mem_limit: ${WORKER_MEM_LIMIT:-700m}
    volumes:
      - ./logs:/app/logs
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  db:
    image: postgres:15-alpine
    container_name: ${COMPOSE_PROJECT_NAME:-luran}_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    command:
      - "postgres"
      - "-c"
      - "shared_buffers=${POSTGRES_SHARED_BUFFERS:-256MB}"
      - "-c"
      - "max_connections=${POSTGRES_MAX_CONNECTIONS:-100}"
      - "-c"
      - "work_mem=${POSTGRES_WORK_MEM:-8MB}"
      - "-c"
      - "effective_cache_size=${POSTGRES_EFFECTIVE_CACHE_SIZE:-512MB}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backups:/backups
    restart: unless-stopped
    mem_limit: ${DB_MEM_LIMIT:-1200m}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  redis:
    image: redis:7-alpine
    container_name: ${COMPOSE_PROJECT_NAME:-luran}_redis
    command: redis-server --maxmemory ${REDIS_MAXMEMORY:-256mb} --maxmemory-policy allkeys-lru --save 60 1000
    restart: unless-stopped
    volumes:
      - redis_data:/data
    mem_limit: ${REDIS_MEM_LIMIT:-256m}
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"

  qdrant:
    image: qdrant/qdrant:latest
    container_name: ${COMPOSE_PROJECT_NAME:-luran}_qdrant
    restart: unless-stopped
    environment:
      - QDRANT__SERVICE__GRPC_PORT=6334
      - QDRANT__STORAGE__OPTIMIZERS__DEFAULT_SEGMENT_NUMBER=${QDRANT_DEFAULT_SEGMENT_NUMBER:-4}
    volumes:
      - qdrant_data:/qdrant/storage
    mem_limit: ${QDRANT_MEM_LIMIT:-900m}
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  pgbouncer:
    image: edoburu/pgbouncer:latest@sha256:85d1e38593617af1b5f7f285e97d407e56c29939683cc7cfe4c8f6dc19f1268b
    container_name: ${COMPOSE_PROJECT_NAME:-luran}_pgbouncer
    restart: unless-stopped
    depends_on:
      - db
    environment:
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_HOST: db
      DB_NAME: ${POSTGRES_DB}
      POOL_MODE: transaction
      MAX_CLIENT_CONN: ${PGBOUNCER_MAX_CLIENT_CONN:-300}
      DEFAULT_POOL_SIZE: ${PGBOUNCER_DEFAULT_POOL_SIZE:-20}
      RESERVE_POOL_SIZE: ${PGBOUNCER_RESERVE_POOL_SIZE:-5}
      SERVER_RESET_QUERY: DISCARD ALL
      IGNORE_STARTUP_PARAMETERS: extra_float_digits
      AUTH_TYPE: scram-sha-256
    expose:
      - "5432"
    mem_limit: ${PGBOUNCER_MEM_LIMIT:-128m}

volumes:
  postgres_data:
  redis_data:
  qdrant_data:
