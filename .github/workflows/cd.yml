name: CD - Staging Gate and Deploy

on:
  # develop CI success -> staging deploy. (CI no longer runs on main, so this
  # only ever fires for develop.)
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [develop]
  # main -> production. Promotion only: no CI re-run, no image rebuild. The
  # production-deploy job pulls the image docker.yml already built for this
  # commit on develop, by its long SHA tag.
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy'
        required: true
        default: 'production'
        type: choice
        options:
          - staging
          - production

permissions:
  contents: read

jobs:
  staging-deploy:
    name: Deploy staging stack
    runs-on: ubuntu-latest
    concurrency:
      group: luran-staging-deploy
      cancel-in-progress: false
    if: >
      (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'staging') ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'develop')
    environment:
      name: staging
    outputs:
      deployed_at: ${{ steps.meta.outputs.deployed_at }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Set deploy timestamp
        id: meta
        run: echo "deployed_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and save API image
        env:
          IMAGE_TAG: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          docker build -t luran-api:$IMAGE_TAG .
          docker save luran-api:$IMAGE_TAG | gzip > api-image.tar.gz

      - name: Decrypt staging .env
        env:
          ENV_ENCRYPTION_KEY: ${{ secrets.ENV_ENCRYPTION_KEY }}
        run: |
          if [ -f .env.staging.enc ] && [ -n "$ENV_ENCRYPTION_KEY" ]; then
            openssl enc -aes-256-cbc -d -pbkdf2 -iter 100000 \
              -in .env.staging.enc -out .env -pass "pass:$ENV_ENCRYPTION_KEY"
            echo "Decrypted staging .env successfully"
          else
            echo "No .env.staging.enc or key — server .env must already exist"
          fi

      - name: Copy files to staging stack directory
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          passphrase: ${{ secrets.VPS_SSH_PASSPHRASE }}
          port: ${{ secrets.VPS_PORT || 22 }}
          source: "api-image.tar.gz,docker-compose.prod.yml,alembic.ini,alembic/,.env,scripts/backup_cron.sh"
          target: ${{ secrets.DEPLOY_PATH }}

      - name: Deploy API to staging
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          passphrase: ${{ secrets.VPS_SSH_PASSPHRASE }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            set -euo pipefail
            mkdir -p "${{ secrets.DEPLOY_PATH }}"
            cd "${{ secrets.DEPLOY_PATH }}"
            docker load < api-image.tar.gz
            export API_IMAGE="luran-api:${{ github.event.workflow_run.head_sha || github.sha }}"
            docker compose -f docker-compose.prod.yml pull db redis qdrant pgbouncer
            # Start db first and wait for it to be ready. `docker compose pull`
            # may have downloaded a newer image, and the first `run --rm api`
            # below recreates the db container as a dependency — Postgres
            # accepts TCP before it finishes init, which kills the migration
            # connection. Block here until pg_isready succeeds.
            docker compose -f docker-compose.prod.yml up -d db
            for attempt in $(seq 1 30); do
              if docker compose -f docker-compose.prod.yml exec -T db \
                pg_isready -U "${POSTGRES_USER:-postgres}" >/dev/null 2>&1; then
                echo "DB is ready"
                break
              fi
              if [ "$attempt" -eq 30 ]; then
                echo "DB did not become ready within 60s" >&2
                docker compose -f docker-compose.prod.yml logs --tail=100 db >&2 || true
                exit 1
              fi
              sleep 2
            done
            # Multi-phase migration: each encryption-expansion migration is paired
            # with its backfill, then the follow-up NOT NULL constraint. All
            # backfills are idempotent — safe on re-runs.
            docker compose -f docker-compose.prod.yml run --rm api alembic upgrade 145bebe88ecb
            docker compose -f docker-compose.prod.yml run --rm api python /app/scripts/backfill_encrypt_secrets.py
            docker compose -f docker-compose.prod.yml run --rm api python /app/scripts/backfill_encrypt_payments.py
            docker compose -f docker-compose.prod.yml run --rm api python /app/scripts/backfill_encrypt_messages.py
            docker compose -f docker-compose.prod.yml run --rm api python /app/scripts/backfill_encrypt_pii.py
            docker compose -f docker-compose.prod.yml run --rm api alembic upgrade 3d8e2fa91c07
            docker compose -f docker-compose.prod.yml run --rm api python /app/scripts/backfill_encrypt_user_admin.py
            docker compose -f docker-compose.prod.yml run --rm api alembic upgrade head
            docker compose -f docker-compose.prod.yml run --rm api python /app/scripts/seed_data.py
            docker compose -f docker-compose.prod.yml run --rm api python /app/scripts/seed_staging_e2e.py
            docker compose -f docker-compose.prod.yml up -d
            HEALTH_URL="http://localhost:${{ secrets.API_PORT || 8000 }}/api/v1/health"
            for attempt in $(seq 1 12); do
              if curl --fail --silent --show-error "$HEALTH_URL" >/dev/null; then
                echo "Staging API is healthy."
                break
              fi
              if [ "$attempt" -eq 12 ]; then
                echo "Staging API failed health check after waiting." >&2
                docker compose -f docker-compose.prod.yml ps >&2 || true
                docker compose -f docker-compose.prod.yml logs --tail=200 api worker pgbouncer db redis qdrant >&2 || true
                exit 1
              fi
              echo "Waiting for staging API health ($attempt/12)..."
              sleep 10
            done
            docker compose -f docker-compose.prod.yml ps
            rm -f api-image.tar.gz
            # Ensure backup cron is installed (idempotent)
            chmod +x scripts/backup_cron.sh 2>/dev/null || true
            (crontab -l 2>/dev/null | grep -v "backup_cron.sh"; echo "0 2 * * * ${{ secrets.DEPLOY_PATH }}/scripts/backup_cron.sh >> ${{ secrets.DEPLOY_PATH }}/backups/backup.log 2>&1") | crontab -
            echo "Backup cron installed: daily at 2 AM"

      - name: Capture staging deployment context
        run: |
          echo "Staging API URL: ${{ secrets.APP_URL }}/api/v1"
          echo "Deployed backend SHA: ${{ github.event.workflow_run.head_sha || github.sha }}"

  staging-smoke:
    name: Staging post-deploy smoke
    runs-on: ubuntu-latest
    needs: staging-deploy
    # Automatic, lightweight post-deploy verification. Runs a fast, stable subset
    # of the live E2E (health + auth + an authenticated DB-backed read + a public
    # read) against staging right after every deploy — catching "healthy but
    # broken" deploys that the /health liveness gate alone cannot. The FULL E2E
    # suite stays manual (staging-api-e2e); this is the cheap per-deploy signal.
    if: needs.staging-deploy.result == 'success'
    environment:
      name: staging

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: 1.8.4
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Install dependencies
        run: poetry install --no-interaction --no-root --with dev

      - name: Reset staging rate-limit keys
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          passphrase: ${{ secrets.VPS_SSH_PASSPHRASE }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            set -euo pipefail
            cd "${{ secrets.DEPLOY_PATH }}"
            docker compose -f docker-compose.prod.yml exec -T redis sh -lc '
              for pattern in http_auth* http_subscription* http_subscription_read*; do
                for key in $(redis-cli --scan --pattern "$pattern"); do
                  redis-cli DEL "$key" >/dev/null
                done
              done
              echo "Staging rate-limit keys cleared"
            '

      - name: Run smoke checks
        env:
          LURAN_E2E_BASE_URL: ${{ secrets.APP_URL }}/api/v1
          LURAN_E2E_PRO_EMAIL: ${{ secrets.LURAN_E2E_PRO_EMAIL }}
          LURAN_E2E_PRO_PASSWORD: ${{ secrets.LURAN_E2E_PRO_PASSWORD }}
          LURAN_E2E_LITE_EMAIL: ${{ secrets.LURAN_E2E_LITE_EMAIL }}
          LURAN_E2E_LITE_PASSWORD: ${{ secrets.LURAN_E2E_LITE_PASSWORD }}
          LURAN_E2E_QUOTA_EMAIL: ${{ secrets.LURAN_E2E_QUOTA_EMAIL }}
          LURAN_E2E_QUOTA_PASSWORD: ${{ secrets.LURAN_E2E_QUOTA_PASSWORD }}
          LURAN_E2E_PLATFORM_EMAIL: ${{ secrets.LURAN_E2E_PLATFORM_EMAIL }}
          LURAN_E2E_PLATFORM_PASSWORD: ${{ secrets.LURAN_E2E_PLATFORM_PASSWORD }}
          LURAN_E2E_TIMEOUT_SECONDS: '30'
        run: |
          poetry run pytest tests/e2e -m smoke -q | tee staging-smoke.log

      - name: Upload smoke logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: staging-smoke-logs
          path: staging-smoke.log

  staging-api-e2e:
    name: Run staging API E2E
    runs-on: ubuntu-latest
    # Opt-in only, and decoupled from deploy: does NOT run on the automatic
    # develop deploy (workflow_run) and does NOT redeploy staging first. QA
    # dispatches this workflow with environment=staging to run the live API
    # E2E against whatever is currently deployed on staging.
    if: >
      github.event_name == 'workflow_dispatch' &&
      github.event.inputs.environment == 'staging'
    environment:
      name: staging

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: 1.8.4
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Install dependencies
        run: poetry install --no-interaction --no-root --with dev

      - name: Reset staging E2E rate limit keys
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          passphrase: ${{ secrets.VPS_SSH_PASSPHRASE }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            set -euo pipefail
            cd "${{ secrets.DEPLOY_PATH }}"
            docker compose -f docker-compose.prod.yml exec -T redis redis-cli DEL \
              http_auth:127.0.0.1 \
              http_auth:localhost \
              http_subscription:127.0.0.1 \
              http_subscription:localhost \
              http_subscription_read:127.0.0.1 \
              http_subscription_read:localhost >/dev/null || true
            docker compose -f docker-compose.prod.yml exec -T redis sh -lc '
              for pattern in http_auth* http_subscription* http_subscription_read*; do
                for key in $(redis-cli --scan --pattern "$pattern"); do
                  redis-cli DEL "$key" >/dev/null
                done
              done
              echo "Staging rate-limit keys cleared"
            '

      - name: Run live API E2E suite
        env:
          LURAN_E2E_BASE_URL: ${{ secrets.APP_URL }}/api/v1
          LURAN_E2E_PRO_EMAIL: ${{ secrets.LURAN_E2E_PRO_EMAIL }}
          LURAN_E2E_PRO_PASSWORD: ${{ secrets.LURAN_E2E_PRO_PASSWORD }}
          LURAN_E2E_LITE_EMAIL: ${{ secrets.LURAN_E2E_LITE_EMAIL }}
          LURAN_E2E_LITE_PASSWORD: ${{ secrets.LURAN_E2E_LITE_PASSWORD }}
          LURAN_E2E_QUOTA_EMAIL: ${{ secrets.LURAN_E2E_QUOTA_EMAIL }}
          LURAN_E2E_QUOTA_PASSWORD: ${{ secrets.LURAN_E2E_QUOTA_PASSWORD }}
          LURAN_E2E_PLATFORM_EMAIL: ${{ secrets.LURAN_E2E_PLATFORM_EMAIL }}
          LURAN_E2E_PLATFORM_PASSWORD: ${{ secrets.LURAN_E2E_PLATFORM_PASSWORD }}
          LURAN_E2E_TIMEOUT_SECONDS: '60'
        run: |
          poetry run pytest tests/e2e -m e2e -q | tee staging-api-e2e.log

      - name: Upload API E2E logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: staging-api-e2e-logs
          path: staging-api-e2e.log

  production-deploy:
    name: Deploy production stack
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    concurrency:
      group: luran-production-deploy
      cancel-in-progress: false
    # Auto-promote on push to main, or a manual production dispatch. No staging
    # gate, no CI re-run, no image rebuild — this promotes the exact image
    # docker.yml already built+pushed for this commit on develop.
    if: >
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'production')
    environment:
      name: production

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Promote prebuilt image (no rebuild) and save
        env:
          # Promote the image docker.yml already built for the latest develop
          # commit, published via `type=ref,event=branch` as the moving `:develop`
          # tag. main is a promotion of develop, so this is exactly the image
          # develop validated — and it resolves regardless of HOW develop was
          # merged into main (merge commit / squash / fast-forward all work),
          # because we no longer look the image up by main's own (post-merge) SHA.
          REGISTRY_IMAGE: ghcr.io/${{ github.repository }}
          LOCAL_TAG: ${{ github.sha }}
        run: |
          set -euo pipefail
          SRC="${REGISTRY_IMAGE}:develop"
          echo "Promoting latest develop image: $SRC (no rebuild)"
          if ! docker pull "$SRC"; then
            echo "::error::Image $SRC not found in GHCR." >&2
            echo "docker.yml publishes the moving :develop tag on every push to develop." >&2
            echo "Ensure develop's most recent 'Docker Build and Push' run succeeded before promoting to main." >&2
            exit 1
          fi
          docker tag "$SRC" "luran-api:${LOCAL_TAG}"
          docker save "luran-api:${LOCAL_TAG}" | gzip > api-image.tar.gz

      - name: Decrypt production .env
        env:
          ENV_ENCRYPTION_KEY: ${{ secrets.ENV_ENCRYPTION_KEY }}
        run: |
          if [ -f .env.production.enc ] && [ -n "$ENV_ENCRYPTION_KEY" ]; then
            openssl enc -aes-256-cbc -d -pbkdf2 -iter 100000 \
              -in .env.production.enc -out .env -pass "pass:$ENV_ENCRYPTION_KEY"
            echo "Decrypted production .env successfully"
          else
            echo "No .env.production.enc or key — server .env must already exist"
          fi

      - name: Copy files to production stack directory
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          passphrase: ${{ secrets.VPS_SSH_PASSPHRASE }}
          port: ${{ secrets.VPS_PORT || 22 }}
          source: "api-image.tar.gz,docker-compose.prod.yml,alembic.ini,alembic/,.env,scripts/backup_cron.sh"
          target: ${{ secrets.DEPLOY_PATH }}

      - name: Deploy to production
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          passphrase: ${{ secrets.VPS_SSH_PASSPHRASE }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            set -euo pipefail
            mkdir -p "${{ secrets.DEPLOY_PATH }}"
            cd "${{ secrets.DEPLOY_PATH }}"
            docker load < api-image.tar.gz
            export API_IMAGE="luran-api:${{ github.sha }}"
            docker compose -f docker-compose.prod.yml pull db redis qdrant pgbouncer
            # Start db first and wait for it to be ready (see staging-deploy
            # job for full rationale — TCP-up != init-complete on a freshly
            # pulled postgres image).
            docker compose -f docker-compose.prod.yml up -d db
            for attempt in $(seq 1 30); do
              if docker compose -f docker-compose.prod.yml exec -T db \
                pg_isready -U "${POSTGRES_USER:-postgres}" >/dev/null 2>&1; then
                echo "DB is ready"
                break
              fi
              if [ "$attempt" -eq 30 ]; then
                echo "DB did not become ready within 60s" >&2
                docker compose -f docker-compose.prod.yml logs --tail=100 db >&2 || true
                exit 1
              fi
              sleep 2
            done
            # Multi-phase migration: each encryption-expansion migration is paired
            # with its backfill, then the follow-up NOT NULL constraint.
            docker compose -f docker-compose.prod.yml run --rm api alembic upgrade 145bebe88ecb
            docker compose -f docker-compose.prod.yml run --rm api python /app/scripts/backfill_encrypt_secrets.py
            docker compose -f docker-compose.prod.yml run --rm api python /app/scripts/backfill_encrypt_payments.py
            docker compose -f docker-compose.prod.yml run --rm api python /app/scripts/backfill_encrypt_messages.py
            docker compose -f docker-compose.prod.yml run --rm api python /app/scripts/backfill_encrypt_pii.py
            docker compose -f docker-compose.prod.yml run --rm api alembic upgrade 3d8e2fa91c07
            docker compose -f docker-compose.prod.yml run --rm api python /app/scripts/backfill_encrypt_user_admin.py
            docker compose -f docker-compose.prod.yml run --rm api alembic upgrade head
            docker compose -f docker-compose.prod.yml up -d
            HEALTH_URL="http://localhost:${{ secrets.API_PORT || 8000 }}/api/v1/health"
            for attempt in $(seq 1 12); do
              if curl --fail --silent --show-error "$HEALTH_URL" >/dev/null; then
                echo "Production API is healthy."
                break
              fi
              if [ "$attempt" -eq 12 ]; then
                echo "Production API failed health check after waiting." >&2
                docker compose -f docker-compose.prod.yml ps >&2 || true
                docker compose -f docker-compose.prod.yml logs --tail=200 api worker pgbouncer db redis qdrant >&2 || true
                exit 1
              fi
              echo "Waiting for production API health ($attempt/12)..."
              sleep 10
            done
            docker compose -f docker-compose.prod.yml ps
            docker image prune -f
            rm -f api-image.tar.gz
            # Ensure backup cron is installed (idempotent)
            chmod +x scripts/backup_cron.sh 2>/dev/null || true
            (crontab -l 2>/dev/null | grep -v "backup_cron.sh"; echo "0 2 * * * ${{ secrets.DEPLOY_PATH }}/scripts/backup_cron.sh >> ${{ secrets.DEPLOY_PATH }}/backups/backup.log 2>&1") | crontab -
            echo "Backup cron installed: daily at 2 AM"

      - name: Notify deployment status
        if: always()
        run: |
          echo "Production deployment ${{ job.status }}"
          echo "Commit: ${{ github.sha }}"
          echo "Actor: ${{ github.actor }}"
