name: CI

on:
  # develop is the single validation gate: full CI runs on every push to it and
  # on PRs into main/develop. Merging develop -> main does NOT re-run CI (main is
  # removed from the push trigger) — main is a no-re-test production promotion
  # (see cd.yml production-deploy).
  push:
    branches: [develop]
  pull_request:
    branches: [main, develop]

jobs:
  lint:
    name: Lint Code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: 1.8.4
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Load cached venv
        id: cached-poetry-dependencies
        uses: actions/cache@v4
        with:
          path: .venv
          key: venv-${{ runner.os }}-${{ hashFiles('**/poetry.lock') }}

      - name: Install dependencies
        run: poetry install --no-interaction --no-root --with dev

      - name: Lint with ruff
        run: |
          poetry run ruff check app/

      - name: Check formatting with black
        run: |
          poetry run black --check app/

  automation-flow-regression:
    name: Automation/Flow Regression
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: 1.8.4
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Load cached venv
        id: cached-poetry-dependencies-regression
        uses: actions/cache@v4
        with:
          path: .venv
          key: venv-${{ runner.os }}-${{ hashFiles('**/poetry.lock') }}

      - name: Install dependencies
        run: poetry install --no-interaction --no-root --with dev

      - name: Run focused automation and flow regressions
        env:
          SERVER_HOST: "http://localhost:8000"
          FRONTEND_URL: "http://localhost:3000"
          FRONTEND_DOC_URL: "http://localhost:3002"
          DATABASE_URL: "sqlite:///:memory:"
          REDIS_URL: "redis://localhost:6379/0"
          QDRANT_URL: "http://localhost:6333"
          QDRANT_COLLECTION_NAME: "test_collection"
          SECRET_KEY: "test_secret_key_for_ci_testing_32chars_minimum"
          OPENAI_API_KEY: "sk-test-ci-openai-key"
          PAYSTACK_SECRET_KEY: "sk_test_ci_testing_key_12345"
          FIRST_SUPERUSER_EMAIL: "ci_admin@test.com"
          FIRST_SUPERUSER_PASSWORD: "CI_Test_P@ssw0rd_2026!"
          ENVIRONMENT: "test"
        run: |
          poetry run pytest \
            tests/api/v1/test_chat_flow_router.py \
            tests/api/v1/test_flow_action_call_regressions.py \
            -q

  test:
    name: Run Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: 1.8.4
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Load cached venv
        id: cached-poetry-dependencies
        uses: actions/cache@v4
        with:
          path: .venv
          key: venv-${{ runner.os }}-${{ hashFiles('**/poetry.lock') }}

      - name: Install dependencies
        run: poetry install --no-interaction --no-root --with dev

      - name: Run tests
        env:
          SERVER_HOST: "http://localhost:8000"
          FRONTEND_URL: "http://localhost:3000"
          FRONTEND_DOC_URL: "http://localhost:3002"
          DATABASE_URL: "postgresql://test_user:test_password@localhost:5432/test_db"
          REDIS_URL: "redis://localhost:6379/0"
          QDRANT_URL: "http://localhost:6333"
          QDRANT_COLLECTION_NAME: "test_collection"
          SECRET_KEY: "test_secret_key_for_ci_testing_32chars_minimum"
          OPENAI_API_KEY: "sk-test-ci-openai-key"
          PAYSTACK_SECRET_KEY: "sk_test_ci_testing_key_12345"
          FIRST_SUPERUSER_EMAIL: "ci_admin@test.com"
          FIRST_SUPERUSER_PASSWORD: "CI_Test_P@ssw0rd_2026!"
          ENVIRONMENT: "test"
        run: |
          poetry run pytest tests/ -v --cov=app --cov-report=xml --cov-report=term

      - name: Upload coverage reports
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          flags: unittests
          name: codecov-umbrella
        continue-on-error: true

  build:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: [lint, test, automation-flow-regression]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: luran-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: [build]

    steps:
      - uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
        continue-on-error: true

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-results.sarif'
        continue-on-error: true
